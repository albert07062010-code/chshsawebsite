<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHSHSA | 彰中社團名冊</title>
    <link rel="icon" href="image.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-navy: #1A2332;
            --brand-red: #E24A45;
            --brand-light: #F8F9FA;
            --white: #FFFFFF;
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #E2E8F0;
            --header-height: 74px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--white);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            opacity: 0;
            animation: pageFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pageFadeIn {
            to { opacity: 1; }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .brand-logo img {
            height: 75px;
            width: auto;
            display: block;
            cursor: pointer;
        }

        nav ul {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            height: 100%;
            align-items: center;
        }

        nav a {
            color: var(--brand-navy);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--brand-red);
        }

        .page-content-wrapper {
            padding: 5rem 10% 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            margin-bottom: 2rem;
        }

        .section-header span {
            color: var(--brand-red);
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.5rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--brand-navy);
        }

        .search-filter-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        @media (min-width: 768px) {
            .search-filter-container {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            background-color: var(--brand-light);
            font-family: inherit;
        }

        .search-box input:focus {
            border-color: var(--brand-navy);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(26, 35, 50, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .category-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: var(--brand-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
        }

        .filter-btn:hover {
            border-color: var(--brand-navy);
            color: var(--brand-navy);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--brand-navy);
            color: var(--white);
            border-color: var(--brand-navy);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 35, 50, 0.2);
        }

        .departments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .club-card-item {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.3s, box-shadow 0.3s;
        }

        .club-card-item.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .club-card-item:hover {
            transform: translateY(-6px);
            border-color: var(--brand-navy);
            box-shadow: 0 15px 35px rgba(26, 35, 50, 0.08);
        }

        .club-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .club-id {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.85rem;
            color: var(--brand-red);
            letter-spacing: 0.1em;
        }

        .club-category {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            background: var(--brand-light);
            color: var(--brand-navy);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .club-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--brand-navy);
            margin-bottom: 1rem;
        }

        .club-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .club-ig-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: var(--brand-light);
            color: var(--brand-navy);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .ig-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .ig-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--brand-navy);
            transition: fill 0.3s ease;
        }

        .club-ig-btn:hover {
            background: var(--brand-navy);
            color: #ffffff;
            border-color: var(--brand-navy);
            box-shadow: 0 6px 20px rgba(26, 35, 50, 0.15);
        }

        .club-ig-btn:hover .ig-icon svg {
            fill: #ffffff;
        }

        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--white);
            z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        #preloader.loaded { opacity: 0; visibility: hidden; }
        .loader-logo img { width: 90px; margin-bottom: 25px; }
        .loader-spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-color);
            border-top-color: var(--brand-red); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .footer {
            background-color: #000000;
            color: var(--white);
            padding: 3rem 5% 2rem;
            border-top: 4px solid var(--brand-red);
            text-align: center;
        }
        .footer-info p { margin-bottom: 8px; color: rgba(255,255,255,0.7); font-size: 0.95rem; }
        .footer-info p:first-child { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .footer-divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 1.5rem auto; max-width: 600px; }
        .footer-copyright { font-size: 0.85rem; color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-logo"><img src="image.png" alt="Loading..."></div>
        <div class="loader-spinner"></div>
    </div>

    <header>
        <div class="brand-logo" id="back-to-home-logo">
            <img src="image.png" alt="CHSHSA Logo">
        </div>
        <nav>
            <ul>
                <li><a class="nav-link" id="back-to-home-link" href="/">返回首頁</a></li>
                <li><a class="nav-link active">社團名冊</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-container" style="overflow-y: auto; height: calc(100vh - var(--header-height)); margin-top: var(--header-height);">
        <div class="page-content-wrapper">
            <div class="section-header">
                <span>Campus Clubs</span>
                <h2>彰中社團一覽</h2>
                <p style="color: var(--text-muted); margin-top: 0.8rem; font-size: 1.05rem;">
                    探索校內各大自治、學術、藝文與運動社團，點擊按鈕即可前往各社團官方 Instagram 了解更多資訊！
                </p>
            </div>

            <div class="search-filter-container">
                <div class="search-box">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M21.71 20.29l-5.002-5.002A7.953 7.953 0 0018 10a8 8 0 10-8 8 7.953 7.953 0 005.288-1.292l5.002 5.002a1 1 0 001.414-1.414zM10 16a6 6 0 116-6 6 6 0 01-6 6z"/>
                    </svg>
                    <input type="text" id="club-search-input" placeholder="輸入社團名稱或關鍵字搜尋...">
                </div>
                <div class="category-filters" id="category-filters-container">
                    <button class="filter-btn active" data-category="all">全部社團</button>
                </div>
            </div>

            <div class="departments-grid" id="clubs-container"></div>
        </div>

        <footer class="footer">
            <div class="footer-container">
                <div class="footer-info">
                    <p>國立彰化高級中學 學生會</p>
                    <p>地址：500 彰化縣彰化市中興路 78 號</p>
                    <p>聯絡電話：04-7222121</p>
                </div>
                <hr class="footer-divider">
                <div class="footer-copyright">
                    <p>&copy; 2026 彰化高中學生會. All Rights Reserved.</p>
                </div>
            </div>
        </footer>
    </main>

    <!-- 引入 CSV 解析套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        function safeUrl(url) {
            if (!url) return '';
            let trimmed = String(url).trim();
            if (trimmed === '' || trimmed === '#') return '';
            if (/^(javascript|data|vbscript):/i.test(trimmed)) return '';
            if (!/^[a-zA-Z]+:\/\//.test(trimmed) && !/^(mailto|tel):/i.test(trimmed)) {
                trimmed = 'https://' + trimmed;
            }
            return encodeURI(trimmed);
        }

        const CLUBS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7akRmJd6kLkLVbzMjLEhjkca0KBhEOPyDMRCvQhx9Ritb_O8R8UBFwTcE7c3w0s4nnnld9bSECigi/pub?output=csv";

        let allClubsData = [];
        let currentCategory = 'all';
        let currentSearchKeyword = '';

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('clubs-container');
            if (!container) return;

            container.innerHTML = `<p style="text-align:center; color:#666; padding: 2rem; font-weight: 700;">社團資料同步中...</p>`;

            Papa.parse(CLUBS_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const validData = results.data.filter(item => item.name && item.name.trim() !== "");
                    initClubApp(validData);
                },
                error: function(err) {
                    container.innerHTML = '<p style="text-align:center; color:#E24A45; padding: 2rem;">無法載入社團資料，請檢查網路連線。</p>';
                }
            });

            // 綁定返回首頁與 Logo 的平滑淡出跳轉事件
            const backToHomeLinks = [
                document.getElementById('back-to-home-link'),
                document.getElementById('back-to-home-logo')
            ];

            backToHomeLinks.forEach(element => {
                if (element) {
                    element.addEventListener('click', (e) => {
                        e.preventDefault();
                        
                        document.body.style.transition = 'opacity 0.4s ease';
                        document.body.style.opacity = '0';
                        
                        setTimeout(() => {
                            // 統一導向網站首頁根路徑（index.html）
                            window.location.href = './';
                        }, 400);
                    });
                }
            });
        });

        function initClubApp(data) {
            allClubsData = data;
            setupCategories(data);
            setupSearchAndFilterEvents();
            filterAndRenderClubs();
        }

        function setupCategories(data) {
            const filtersContainer = document.getElementById('category-filters-container');
            if (!filtersContainer) return;

            const categories = [...new Set(data.map(item => item.category ? item.category.trim() : '其他'))].filter(Boolean);

            let buttonsHTML = `<button class="filter-btn active" data-category="all">全部社團</button>`;
            categories.forEach(cat => {
                buttonsHTML += `<button class="filter-btn" data-category="${escapeHTML(cat)}">${escapeHTML(cat)}</button>`;
            });

            filtersContainer.innerHTML = buttonsHTML;
        }

        function setupSearchAndFilterEvents() {
            const searchInput = document.getElementById('club-search-input');
            const filtersContainer = document.getElementById('category-filters-container');

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    currentSearchKeyword = e.target.value.trim().toLowerCase();
                    filterAndRenderClubs();
                });
            }

            if (filtersContainer) {
                filtersContainer.addEventListener('click', (e) => {
                    if (e.target.classList.contains('filter-btn')) {
                        filtersContainer.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                        e.target.classList.add('active');

                        currentCategory = e.target.getAttribute('data-category');
                        filterAndRenderClubs();
                    }
                });
            }
        }

        function filterAndRenderClubs() {
            const container = document.getElementById('clubs-container');
            if (!container) return;

            const filtered = allClubsData.filter(club => {
                const clubCat = (club.category || '其他').trim();
                const matchesCategory = (currentCategory === 'all' || clubCat === currentCategory);

                const name = (club.name || '').toLowerCase();
                const desc = (club.description || '').toLowerCase();
                const id = (club.id || '').toLowerCase();
                const matchesSearch = name.includes(currentSearchKeyword) || 
                                      desc.includes(currentSearchKeyword) || 
                                      id.includes(currentSearchKeyword);

                return matchesCategory && matchesSearch;
            });

            renderClubs(filtered, container);
        }

        function renderClubs(data, container) {
            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666; padding: 3rem; grid-column: 1 / -1; font-weight: 700;">找不到符合條件的社團。</p>';
                return;
            }

            container.innerHTML = data.map((club, index) => {
                const safeLink = safeUrl(club.igUrl);
                const clubId = escapeHTML(club.id || String(index + 1).padStart(2, '0'));
                const delay = (index % 6) * 0.08;

                const igButtonHTML = safeLink 
                    ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer" class="club-ig-btn">
                        <span class="ig-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                        </span>
                        <span>追蹤社團 IG</span>
                    </a>`
                    : '';

                return `
                    <div class="club-card-item" style="transition-delay: ${delay}s;">
                        <div>
                            <div class="club-card-top">
                                <span class="club-id">NO. ${clubId}</span>
                                <span class="club-category">${escapeHTML(club.category || '社團')}</span>
                            </div>
                            <h3 class="club-title">${escapeHTML(club.name)}</h3>
                            <p class="club-desc">${escapeHTML(club.description)}</p>
                        </div>
                        ${igButtonHTML ? `<div>${igButtonHTML}</div>` : ''}
                    </div>
                `;
            }).join('');

            initScrollObserver();
        }

        function initScrollObserver() {
            const cards = document.querySelectorAll('.club-card-item');
            
            const observer = new IntersectionObserver((entries, observerInstance) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observerInstance.unobserve(entry.target);
                    }
                });
            }, {
                root: document.getElementById('app-container'),
                threshold: 0.15
            });

            cards.forEach(card => observer.observe(card));
        }

        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                setTimeout(() => {
                    preloader.classList.add('loaded');
                    setTimeout(() => { preloader.remove(); }, 600); 
                }, 1000);
            }
        });
    </script>
</body>
</html>
